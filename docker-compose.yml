services:
  deskbuddy:
    image: ghcr.io/kaillouxwebdev/deskbuddy:latest
    container_name: deskbuddy
    restart: unless-stopped
    # Réseau de l'hôte : accès direct à l'imprimante sur le LAN et à l'IP du Pi.
    network_mode: host
    # Nécessaire pour piloter le rétroéclairage (/sys/class/backlight) : veille et luminosité.
    privileged: true
    # Espace de processus de l'hôte : réglage du Wi-Fi depuis l'écran (nmcli de l'hôte via nsenter).
    pid: host
    env_file: .env
    environment:
      TZ: Europe/Paris
    volumes:
      - ./data:/data
